name: Prepare daily songs

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: daily-playlist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: [self-hosted, Windows, X64, balkanguess]
    timeout-minutes: 45
    env:
      CATALOG_STORAGE: r2
      YTDLP_PATH: ${{ vars.YTDLP_PATH }}
      FFMPEG_PATH: ${{ vars.FFMPEG_PATH }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify media tools
        shell: powershell
        run: |
          if (-not $env:YTDLP_PATH -or -not (Test-Path -LiteralPath $env:YTDLP_PATH -PathType Leaf)) {
            throw "Set the repository variable YTDLP_PATH to the full path of yt-dlp.exe on the self-hosted runner."
          }
          if (-not $env:FFMPEG_PATH -or -not (Test-Path -LiteralPath $env:FFMPEG_PATH -PathType Leaf)) {
            throw "Set the repository variable FFMPEG_PATH to the full path of ffmpeg.exe on the self-hosted runner."
          }
          & $env:YTDLP_PATH --version
          & $env:FFMPEG_PATH -version

      - name: Apply database migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Prune raw anonymous results
        run: npm run db:prune-results
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Refresh playlist catalog
        run: npm run playlist -- import-all
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Prepare seven days
        run: npm run playlist -- prepare 7
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
